name: Build EchoTube Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build Release APK
        run: ./gradlew :app:assembleGithubRelease -x uploadCrashlyticsMappingFileGithubRelease -Pandroid.injected.signing.store.file=$(pwd)/release.keystore -Pandroid.injected.signing.store.password=szxkmix0u -Pandroid.injected.signing.key.alias=shuzxie -Pandroid.injected.signing.key.password=szxkmix0u

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoTube-Release-APK
          path: app/build/outputs/apk/github/release/*.apk
