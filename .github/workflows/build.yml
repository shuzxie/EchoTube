name: Build EchoTube APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Kita bikin file google-services.json palsu (dummy)
      # Ini cukup buat build, tapi fitur Analytics/Crashlytics mungkin nggak jalan
      - name: Create Dummy Firebase Config
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "echotube-dummy"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.echotube.app"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildPurposesOnly"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleGithubDebug
        env:
          # Kadang butuh ini biar Gradle nggak nyari SDK
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoTube-Debug
          path: app/build/outputs/apk/github/debug/*.apk
